<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WiFi Access</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eef2f7; color: #333; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h1 { margin-top: 0; color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 2rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1.5rem; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; text-align: center; text-transform: uppercase; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to Free WiFi</h1>
        <p>Enter your voucher code to connect.</p>
        <form action="/auth" method="post">
            <input type="text" name="voucher_code" placeholder="XXXX-XXXX" required>
            <button type="submit">Connect Now</button>
        </form>
    </div>
</body>
</html>
